name: Build Executables (Windows & Linux)

on:
  push:
    branches: [ executable, main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onedir --windowed --name "ki-talii" --collect-all customtkinter --noconfirm gui.py
          copy config.example.yaml dist\ki-talii\

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path dist\ki-talii\* -DestinationPath dist\ki-talii-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ki-talii-windows-x64
          path: dist/ki-talii-windows-x64.zip

  build-linux-deb:
    name: Build Linux .deb Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev python3-tk
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run Debian packaging script
        run: |
          chmod +x packaging/linux/build_deb.sh
          bash packaging/linux/build_deb.sh

      - name: Upload Linux .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ki-talii-linux-deb
          path: "*.deb"
